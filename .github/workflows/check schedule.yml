name: 桃園市長行程捷運提醒

on:
  schedule:
    # cron 是 UTC 時間,台灣時間 = UTC + 8
    # 每天 UTC 10:00 (台灣時間 18:00) 執行一次,檢查隔天的行程
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動點擊執行,方便測試

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行檢查並發送 LINE 通知
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          KEYWORDS: "捷運,機捷,綠線,桃捷,桃園捷運,桃捷公司,A8,A9,A10,A11,A12,A13,A14,A14a,A15,A16,A17,A18,A19,A20,A21,A22"
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python check_schedule.py
